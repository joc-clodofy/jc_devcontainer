services:
  odoo-dev:
    container_name: odoo-dev
    # image: mjavint/odoodev:16.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Si no defines data_dir en tu .conf, Odoo usa appdirs; esto fuerza datos bajo el volumen montado.
      XDG_DATA_HOME: /var/lib/odoo/xdg-data
      # Solo aplica cuando NO usas -c/--config (Odoo prioriza -c sobre ODOO_RC).
      ODOO_RC: /workspace/.devcontainer/odoo-defaults.conf
    volumes:
      - ..:/workspace
      - ../odools.toml:/home/odoo/odools.toml
      - ${ODOO_SERVER}:/workspace/odoo
      # - ${ENTERPRISE_ADDONS}:/workspace/enterprise:ro
      # Filestore/sessions de Odoo: por defecto van a ~/.local/share/Odoo; el Dockerfile enlaza esa ruta a /var/lib/odoo (este volumen).
      - odoo-data:/var/lib/odoo
    command: sleep infinity
    depends_on:
      - pgdb
    # 8069 en el host: acceso directo a Odoo y compatibilidad con wkhtmltopdf/report.url en HTTP sin SSL local.
    ports:
      - "8069:8069"
    expose:
      - "8069"
      - "8071"
      - "8072"
    networks:
      - shared-net

  pgdb:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: pgdb
    volumes:
      - pgdb-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
    # ports:
    #   - "5432:5433"
    networks:
      - shared-net

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "8085:80"
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - shared-net

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - odoo-dev
    networks:
      - shared-net

volumes:
  odoo-data:
  pgdb-data:
  pgadmin-data:

networks:
  shared-net:
    external: true
